# TCERP CI — one workflow, two jobs (backend with a real PostgreSQL test
# database + a real MinIO for the files service, frontend typecheck+build).
# The integration suite runs in-band against the dedicated `tcerp_test`
# database — the DATABASE_URL fail-closed guard (src/testing/db-guard.ts)
# allows exactly localhost:5432/tcerp_test.
# pull_request has NO branch filter: stacked PRs (feature → feature) get
# real CI too, not just PRs targeting main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tcerp
          POSTGRES_PASSWORD: tcerp
          POSTGRES_DB: tcerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcerp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      DATABASE_URL: postgresql://tcerp:tcerp@localhost:5432/tcerp_test?schema=public
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: tcerpminio
      S3_SECRET_KEY: tcerpminio123
      S3_BUCKET: tcerp-files
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      # D-5/Phase 3 upload tests need a REAL S3-compatible server. GitHub
      # services cannot pass `server /data` to the minio image, so MinIO is
      # started as a plain docker step (health-checked with curl).
      # D5-01: stable MinIO without registry roulette — Docker Hub removed
      # the minio images (pull denied), quay/ECR/mirror all fail anonymous.
      # MinIO's OWN CDN (dl.min.io) serves the static server binary — no
      # auth, no rate limit. S3-backed tests then run for REAL in CI.
      - name: Start MinIO (files service storage)
        run: |
          curl -sfL -o /tmp/minio https://dl.min.io/server/minio/release/linux-amd64/minio
          chmod +x /tmp/minio
          MINIO_ROOT_USER=tcerpminio MINIO_ROOT_PASSWORD=tcerpminio123             nohup /tmp/minio server /tmp/minio-data --address :9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO healthy after ${i}x2s"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live > /dev/null
      - name: Declare S3 coverage status
        if: failure()
        run: |
          echo "::error::S3/MinIO storage tests: NOT_TESTED in this CI run — no reachable MinIO distribution (Docker Hub removed minio images; quay/ECR anonymous denied; dl.min.io gated). The S3-backed tests SKIP via the runtime probe; they are verified where a real MinIO exists (local/dev)."
          echo "## S3/MinIO storage tests: NOT_TESTED in CI" >> "$GITHUB_STEP_SUMMARY"
          echo "No reachable MinIO distribution remains public (Docker Hub removed minio images; quay anonymous 401; ECR 404; dl.min.io gated). The S3-backed tests skipped via the runtime probe — file-feature merge readiness for storage coverage is NOT claimed from this run." >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate test database
        run: npx prisma migrate deploy
      - name: Seed test database
        run: npm run db:seed
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npm test -- --ci
      - name: Integration tests (in-band, tcerp_test)
        run: npm run test:integration -- --ci
      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build
