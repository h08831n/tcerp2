# TCERP CI — one workflow, two jobs (backend with a real PostgreSQL test
# database + a real MinIO for the files service, frontend typecheck+build).
# The integration suite runs in-band against the dedicated `tcerp_test`
# database — the DATABASE_URL fail-closed guard (src/testing/db-guard.ts)
# allows exactly localhost:5432/tcerp_test.
# pull_request has NO branch filter: stacked PRs (feature → feature) get
# real CI too, not just PRs targeting main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tcerp
          POSTGRES_PASSWORD: tcerp
          POSTGRES_DB: tcerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcerp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      DATABASE_URL: postgresql://tcerp:tcerp@localhost:5432/tcerp_test?schema=public
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: tcerpminio
      S3_SECRET_KEY: tcerpminio123
      S3_BUCKET: tcerp-files
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      # D-5/Phase 3 upload tests need a REAL S3-compatible server. GitHub
      # services cannot pass `server /data` to the minio image, so MinIO is
      # started as a plain docker step (health-checked with curl).
      - name: Start MinIO (files service storage)
        run: |
          # Docker Hub anonymous pulls are rate-limited; try the Google
          # mirror first, then fall back to docker.io with backoff.
          IMAGE=""
          for ref in mirror.gcr.io/minio/minio:latest minio/minio:latest; do
            for attempt in 1 2 3; do
              if docker pull "$ref"; then IMAGE="$ref"; break 2; fi
              sleep $((attempt * 10))
            done
          done
          if [ -z "$IMAGE" ]; then
            echo "::warning::MinIO image unavailable from all registries — S3-backed tests will skip (runtime probe)"
            exit 0
          fi
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=tcerpminio \
            -e MINIO_ROOT_PASSWORD=tcerpminio123 \
            "$IMAGE" server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO healthy after ${i}x2s"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live > /dev/null
      - name: Install dependencies
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate test database
        run: npx prisma migrate deploy
      - name: Seed test database
        run: npm run db:seed
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npm test -- --ci
      - name: Integration tests (in-band, tcerp_test)
        run: npm run test:integration -- --ci
      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build
