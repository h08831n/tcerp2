# TCERP CI — one workflow, two jobs (backend with a real PostgreSQL test
# database + a real MinIO for the files service, frontend typecheck+build).
# The integration suite runs in-band against the dedicated `tcerp_test`
# database — the DATABASE_URL fail-closed guard (src/testing/db-guard.ts)
# allows exactly localhost:5432/tcerp_test.
# pull_request has NO branch filter: stacked PRs (feature → feature) get
# real CI too, not just PRs targeting main.
# D5-01: MinIO starts in the SAME shell as the integration tests (a
# background process from an earlier step was reaped between steps on the
# runner). The binary comes from MinIO's own CDN (dl.min.io) — Docker Hub
# removed the minio images, quay/ECR/mirror deny anonymous pulls. If the
# CDN is unreachable the integration step declares S3 coverage NOT_TESTED
# and the runtime probe in the specs skips those tests — a silent pass is
# impossible (the skip is logged and the warning appears on the run).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tcerp
          POSTGRES_PASSWORD: tcerp
          POSTGRES_DB: tcerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcerp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      DATABASE_URL: postgresql://tcerp:tcerp@localhost:5432/tcerp_test?schema=public
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: tcerpminio
      S3_SECRET_KEY: tcerpminio123
      S3_BUCKET: tcerp-files
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate test database
        run: npx prisma migrate deploy
      - name: Seed test database
        run: npm run db:seed
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npm test -- --ci
      # D5-01: MinIO Docker Hub images were REMOVED by MinIO (2025 policy —
      # "pull access denied" is permanent, not a rate limit). quay/ECR/
      # mirror.gcr all deny anonymous pulls. dl.min.io CDN is gated.
      # There is NO public MinIO distribution reachable from GH Actions.
      # → S3-backed tests SKIP via the runtime probe. The job runs green
      #   for all non-S3 tests; the ::error:: annotation and the step
      #   summary explicitly declare S3 coverage NOT_TESTED.
      # → Storage coverage is verified WHERE A REAL MINIO EXISTS (local
      #   dev: d5-weighbridge 4/4, d2-phase3-files 5/5 — see local battery).
      - name: Integration tests (in-band, tcerp_test)
        run: |
          echo "::error::S3/MinIO storage tests: NOT_TESTED in this CI run — no public MinIO distribution is reachable from GitHub Actions (Docker Hub removed minio images; quay/ECR/mirror/CDN all gated). S3-backed tests SKIP via the runtime probe; verified only where a real MinIO exists (local/dev)."
          echo "## S3/MinIO storage tests: NOT_TESTED in CI" >> "$GITHUB_STEP_SUMMARY"
          npm run test:integration -- --ci
      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build
