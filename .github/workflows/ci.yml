# TCERP CI — one workflow, two jobs (backend with a real PostgreSQL test
# database + a real MinIO for the files service, frontend typecheck+build).
# The integration suite runs in-band against the dedicated `tcerp_test`
# database — the DATABASE_URL fail-closed guard (src/testing/db-guard.ts)
# allows exactly localhost:5432/tcerp_test.
# pull_request has NO branch filter: stacked PRs (feature → feature) get
# real CI too, not just PRs targeting main.
# D5-01: MinIO starts in the SAME shell as the integration tests (a
# background process from an earlier step was reaped between steps on the
# runner). The binary comes from MinIO's own CDN (dl.min.io) — Docker Hub
# removed the minio images, quay/ECR/mirror deny anonymous pulls. If the
# CDN is unreachable the integration step declares S3 coverage NOT_TESTED
# and the runtime probe in the specs skips those tests — a silent pass is
# impossible (the skip is logged and the warning appears on the run).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tcerp
          POSTGRES_PASSWORD: tcerp
          POSTGRES_DB: tcerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcerp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      DATABASE_URL: postgresql://tcerp:tcerp@localhost:5432/tcerp_test?schema=public
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: tcerpminio
      S3_SECRET_KEY: tcerpminio123
      S3_BUCKET: tcerp-files
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate test database
        run: npx prisma migrate deploy
      - name: Seed test database
        run: npm run db:seed
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npm test -- --ci
      # D5-01: MinIO runs as a docker container (daemon-managed — survives
      # the whole step) pulled from docker.io with backoff retries. The
      # earlier denial was a transient anonymous rate limit — postgres:16
      # pulls from the same registry in the same job. If ALL retries fail
      # the job FAILS honestly: a green run without storage coverage is
      # NOT storage verification.
      - name: Integration tests (in-band, tcerp_test, with MinIO)
        run: |
          IMAGE=""
          for attempt in 1 2 3 4 5; do
            if docker pull minio/minio:latest; then IMAGE="minio/minio:latest"; break; fi
            echo "MinIO pull attempt $attempt failed — backing off"
            sleep $((attempt * 20))
          done
          if [ -z "$IMAGE" ]; then
            echo "::error::S3/MinIO storage tests: NOT_RUN — MinIO image could not be pulled after 5 attempts. This is a FAILURE, not a pass."
            exit 1
          fi
          docker run -d --name minio-test -p 9000:9000             -e MINIO_ROOT_USER=tcerpminio             -e MINIO_ROOT_PASSWORD=tcerpminio123             "$IMAGE" server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then
              echo "MinIO healthy after ${i}x2s — S3-backed tests RUN"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null
          npm run test:integration -- --ci
          EXIT=$?
          docker rm -f minio-test > /dev/null 2>&1 || true
          exit $EXIT
      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build
