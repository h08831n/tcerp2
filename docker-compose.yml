services:
  postgres:
    image: postgres:16-alpine
    container_name: tcerp-postgres
    environment:
      POSTGRES_USER: tcerp
      POSTGRES_PASSWORD: tcerp
      POSTGRES_DB: tcerp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcerp -d tcerp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tcerp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tcerp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tcerpminio
      MINIO_ROOT_PASSWORD: tcerpminio123
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
